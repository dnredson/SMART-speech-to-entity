services:
  irrigation-api:
    image: dnredson/smart-irrigacao-api:v0.5.0
    environment:
      PORT: "8030"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-6-luna}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}
      ENTITY_EXTRACTOR: ${ENTITY_EXTRACTOR:-openai}
      STT_PROVIDER: ${STT_PROVIDER:-openai}
      PERSISTENCE_PROVIDER: ${PERSISTENCE_PROVIDER:-firebase}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-smart-app-b807a}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-smart-app-b807a.firebasestorage.app}
      FIRESTORE_EVENTS_COLLECTION: ${FIRESTORE_EVENTS_COLLECTION:-irrigation_events}
      FIRESTORE_USAGE_COLLECTION: ${FIRESTORE_USAGE_COLLECTION:-openai_usage}
      FIREBASE_AUDIO_PREFIX: ${FIREBASE_AUDIO_PREFIX:-irrigation-audio}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      OPENAI_MAX_CALLS_PER_MONTH: ${OPENAI_MAX_CALLS_PER_MONTH:-100}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-20971520}
      MAX_TRANSCRIPT_CHARS: ${MAX_TRANSCRIPT_CHARS:-5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8030:8030"
    restart: unless-stopped

  web-ui:
    image: dnredson/smart-irrigacao-web:v0.5.0
    depends_on:
      - irrigation-api
    ports:
      - "8503:80"
    restart: unless-stopped
