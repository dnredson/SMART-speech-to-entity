services:
  irrigation-api:
    image: dnredson/smart-irrigacao-api:v0.3.0
    environment:
      PORT: "8030"
      SMART_IRRIGATION_DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-6-luna}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}
      ENTITY_EXTRACTOR: ${ENTITY_EXTRACTOR:-openai}
      STT_PROVIDER: ${STT_PROVIDER:-openai}
      OPENAI_MAX_CALLS_PER_MONTH: ${OPENAI_MAX_CALLS_PER_MONTH:-100}
    volumes:
      - irrigation-data:/app/data
    ports:
      - "8030:8030"
    restart: unless-stopped

  web-ui:
    image: dnredson/smart-irrigacao-web:v0.3.0
    depends_on:
      - irrigation-api
    ports:
      - "8503:80"
    restart: unless-stopped

volumes:
  irrigation-data:
